a{color:#7fb3ff;text-decoration:none}a:hover{text-decoration:underline}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;padding:16px 24px 24px;align-items:start}
@media(max-width:1200px){.layout{grid-template-columns:1fr}}
.pg{display:flex;gap:4px;flex-wrap:wrap;align-items:center;justify-content:center;margin:0 0 12px}
.pg button{min-width:34px;height:32px;padding:0 8px;background:var(--card);color:#cfd5de;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:13px}
.pg button.on{background:var(--acc);border-color:var(--acc);color:#fff}.pg button:disabled{opacity:.35;cursor:default}
.pg .info{width:100%;text-align:center;font-size:12px;color:var(--mut);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:calc((100vh - 400px)/2*16/9*2 + 12px);margin:0 auto}
@media(max-width:800px){.grid{grid-template-columns:1fr;max-width:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
iframe{width:100%;aspect-ratio:16/9;border:0;display:block;background:#000}
.cap{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px 6px;font-size:12px}
.cap b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap span{flex:none;color:#7fb3ff;background:#1e2a3d;padding:2px 6px;border-radius:4px;font-size:11px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 10px 10px}
.st button{padding:5px;border:1px solid var(--line);background:transparent;color:#cfd5de;border-radius:6px;cursor:pointer;font-size:12px}
.st button:hover{background:#202631}
.st button.on[data-s=Lancar]{background:#16a34a;border-color:#16a34a;color:#fff}.st button.on[data-s=Padat]{background:#ca8a04;border-color:#ca8a04;color:#fff}.st button.on[data-s=Macet]{background:#dc2626;border-color:#dc2626;color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;position:sticky;top:16px}
.panel h2{margin:0 0 4px;font-size:16px}.panel h3{font-size:13px;margin:16px 0 6px;color:#c4cad4}
.panel .hint{font-size:12px;color:var(--mut);margin:0 0 12px}
#sum{font-size:13px;line-height:1.6}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#2a303a;margin:10px 0 6px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:500}
#reset{margin-top:12px;width:100%;padding:7px;background:transparent;border:1px solid var(--line);color:#cfd5de;border-radius:6px;cursor:pointer}
</style></head><body>

V-01", "u": "https://dki-jkt.balitower.co.id:7028/501478_JKS_SATPOLPP_TAMAN-LITERASI-C01_CCTV-01/embed.html"}, {"n": "Simpang Jl. Panglima Polim-C01", "b": "CCTV-02", "u": "https://dki-jkt.balitower.co.id:7028/501493_JKP_SATPOLPP_PASAR-TANAH-ABANG-C02_CCTV-02/embed.html"}, {"n": "Jl. Sultan Agung-C03", "b": "CCTV-01", "u": "https://dki-jkt.balitower.co.id:7028/501594_JKS_DISGULKARMAT_JL.-MANGGARAI-UTARA-2-C01_CCTV-01/embed.html"}, {"n": "Simpang Jl. Sultan Agung-C01", "b": "CCTV-01", "u": "https://dki-jkt.balitower.co.id:7028/501862_JKB_DISHUB_JL.-LETJEN.-S.-PARMAN-C01_CCTV-01/embed.html"}, {"n": "Simpang Jl. Sultan Agung-C01", "b": "CCTV-03", "u": "https://dki-jkt.balitower.co.id:7028/501862_JKB_DISHUB_JL.-LETJEN.-S.-PARMAN-C01_CCTV-03/embed.html"}, {"n": "Simpang Jl. Sultan Agung-C02", "b": "CCTV-02", "u": "https://dki-jkt.balitower.co.id:7028/502041_JKP_POLDA_JL.-KH.-MAS-MANSYUR-C02_CCTV-02/embed.html"}, {"n": "Pasar Tanah Abang-C02", "b": "CCTV-01", "u": "https://dki-jkt.balitower.co.id:7028/502540_JKB_SATPOL-PP_SIMPANG-JL.-LETJEN.-S.-PARMAN-C02_CCTV-01/embed.html"}, {"n": "Pasar Tanah Abang-C02", "b": "CCTV-02", "u": "https://dki-jkt.balitower.co.id:7028/502540_JKB_SATPOL-PP_SIMPANG-JL.-LETJEN.-S.-PARMAN-C02_CCTV-02/embed.html"}, {"n": "Jl. KH. Mas Mansyur-C02", "b": "CCTV-01", "u": "https://dki-jkt.balitower.co.id:7028/503343_JKP_DBM_JPO-JL.-CIDENG-TIMUR-C02_CCTV-01/embed.html"}, {"n": "Jl. KH. Mas Mansyur-C02", "b": "CCTV-02", "u": "https://dki-jkt.balitower.co.id:7028/503343_JKP_DBM_JPO-JL.-CIDENG-TIMUR-C02_CCTV-02/embed.html"}, {"n": "Jl. Jati Baru Raya-C02", "b": "CCTV-01", "u": "https://dki-jkt.balitower.co.id:7028/503675_JKP_BAKESBANGPOL_JL.-JATI-BARU-RAYA-C02_CCTV-01/embed.html"}, {"n": "Simpang Jl Nurdin Raya C01", "b": "CCTV-01", "u": "https://dki-jkt.balitower.co.id:7028/501968-Simpang-Jl-Nurdin-Raya-C01_CCTV-01/embed.html"}, {"n": "Simpang Jl Nurdin Raya C01", "b": "CCTV-02", "u": "https://dki-jkt.balitower.co.id:7028/501968-Simpang-Jl-Nurdin-Raya-C01_CCTV-02/embed.html"}, {"n": "Senayan 018", "b": "CCTV-2", "u": "https://jakcctv.jakarta.go.id/Senayan-018-705979_2?proto=hls"}, {"n": "Senayan 001", "b": "CCTV-2", "u": "https://jakcctv.jakarta.go.id/Senayan-001-705084_2?proto=hls"}, {"n": "Bendungan Hilir 003", "b": "CCTV-1", "u": "https://jakcctv.jakarta.go.id/Bendungan-Hilir-003-700014_1?proto=hls"}, {"n": "Kebon Melati 010", "b": "CCTV-2", "u": "https://jakcctv.jakarta.go.id/Kebon-Melati-010-700332_2?proto=hls"}];
const PER=4, KEY='cctv-traffic';
let page=1, q='';
let S={}; try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const id=c=>c.u;
const esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function list(){return CAMS.filter(c=>c.n.toLowerCase().includes(q))}
function render(){
  const L=list(), pages=Math.max(1,Math.ceil(L.length/PER)); if(page>pages)page=pages;
  const sl=L.slice((page-1)*PER,page*PER);
  document.getElementById('grid').innerHTML=sl.map(c=>{const s=S[id(c)]?.s;return `<div class="card">
   <iframe src="${c.u}" allowfullscreen referrerpolicy="no-referrer"></iframe>
   <div class="cap"><b>${esc(c.n)}</b> <span>${c.b}</span></div>
   <div class="st">${['Lancar','Padat','Macet'].map(x=>`<button data-s="${x}" data-id="${c.u}" class="${s===x?'on':''}">${x}</button>`).join('')}</div></div>`}).join('')||'<p>Tidak ada hasil.</p>';
  const pg=`<button data-p="${page-1}" ${page<=1?'disabled':''}>&laquo;</button>`+
    Array.from({length:pages},(_,i)=>`<button data-p="${i+1}" class="${i+1===page?'on':''}">${i+1}</button>`).join('')+
    `<button data-p="${page+1}" ${page>=pages?'disabled':''}>&raquo;</button><div class="info">${L.length} kamera • Hal. ${page}/${pages}</div>`;
  pg1.innerHTML=pg; analyse();
}
function analyse(){
  const c={Lancar:0,Padat:0,Macet:0}; CAMS.forEach(x=>{const s=S[id(x)]?.s;if(s)c[s]++});
  const n=CAMS.length, rated=c.Lancar+c.Padat+c.Macet, none=n-rated;
  const idx=rated?Math.round((c.Padat*50+c.Macet*100)/rated):0;
  const lvl=!rated?'-':idx<25?'Lancar':idx<60?'Ramai/Padat':'Macet';
  sum.innerHTML=`Dinilai <b>${rated}/${n}</b> kamera<br>Lancar <b>${c.Lancar}</b> · Padat <b>${c.Padat}</b> · Macet <b>${c.Macet}</b><br>Indeks kepadatan: <b>${rated?idx:'-'}</b>/100 → kondisi umum: <b>${lvl}</b>`;
  const w=v=>(v/n*100)+'%';
  bar.innerHTML=`<div style="width:${w(c.Lancar)};background:#1b7f3b"></div><div style="width:${w(c.Padat)};background:#b8860b"></div><div style="width:${w(c.Macet)};background:#b22222"></div><div style="width:${w(none)};background:#444"></div>`;
  const hotL=CAMS.filter(x=>['Macet','Padat'].includes(S[id(x)]?.s)).sort((a,b)=>(S[id(b)].s==='Macet')-(S[id(a)].s==='Macet'));
  hot.innerHTML=hotL.map(x=>`<tr><td>${esc(x.n)} <span style="color:#8b95a5">${x.b}</span></td><td>${S[id(x)].s}</td><td>${new Date(S[id(x)].t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</td></tr>`).join('')||'<tr><td colspan=3>Belum ada.</td></tr>';
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.p){page=+b.dataset.p;render();}
  else if(b.dataset.s){const k=b.dataset.id;S[k]?.s===b.dataset.s?delete S[k]:S[k]={s:b.dataset.s,t:Date.now()};save();
    b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',S[k]?.s===x.dataset.s));analyse()}
  else if(b.id==='reset'&&confirm('Hapus semua penilaian?')){S={};save();render()}});
document.getElementById('q').oninput=e=>{q=e.target.value.toLowerCase();page=1;render()};
render();
</script></body></html>
